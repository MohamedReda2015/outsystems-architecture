name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skill consistency (frontmatter, links, rule IDs, hygiene)
        run: node scripts/check_skill.mjs

      - name: Validator regression (Node)
        run: node scripts/test_validator.mjs

      - name: Dependency semantics and input validation
        run: python tests/test_validator.py -v

      - name: Python and Node validators produce identical output
        run: |
          set -u
          for input in example_deps.json example_deps_bad.json; do
            for mode in "" "--strict"; do
              set +e
              python scripts/validate_architecture.py "scripts/$input" $mode --json > py.json; py=$?
              node scripts/validate_architecture.mjs "scripts/$input" $mode --json > js.json; js=$?
              set -e
              echo "$input $mode -> python exit $py, node exit $js"
              [ "$py" = "$js" ] || { echo "exit codes differ"; exit 1; }
              diff -u js.json py.json || { echo "outputs differ for $input $mode"; exit 1; }
            done
          done

      - name: Package the skill (smoke test)
        run: |
          git archive --format=zip --prefix=outsystems-architecture/ -o outsystems-architecture.zip HEAD
          unzip -l outsystems-architecture.zip | grep -q "outsystems-architecture/SKILL.md"
