name: Rule proposal
description: Propose a new standard, best practice or checklist rule
labels: ["rule-proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong in OutSystems apps without this rule? (No client names or confidential details.)
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Proposed rule
      description: The rule, written as an instruction, plus one sentence on why it matters.
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Group
      options: [ARC - Architecture, HSE - House module standard, DAT - Data and logic, INT - Integrations, UI - Screens/blocks/themes, PERF - Performance, SEC - Security, AUD - Audit, MNT - Maintainability, OPS - Lifecycle/SOP, TST - Testing]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options: [Blocker, Major, Minor]
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to official OutSystems documentation (preferred) or a community source.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Applies to
      multiple: true
      options: [Reactive Web, Mobile, Traditional Web, All O11]
